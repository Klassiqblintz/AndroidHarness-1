name: Build AndroidHarness APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
  # The app requires a GitHub OAuth client ID in local.properties.
  # CI uses a dummy value so the build succeeds without a public client.
  GITHUB_CLIENT_ID: IExdummy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" >> local.properties

      - name: Grant execute permission on gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AndroidHarness-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;35.0.0
            ndk;27.2.12479018

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" >> local.properties

      - name: Run lint
        run: ./gradlew app:lintDebug --no-daemon

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;35.0.0

      - name: Write local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "GITHUB_CLIENT_ID=$GITHUB_CLIENT_ID" >> local.properties

      - name: Run unit tests
        run: ./gradlew app:testDebugUnitTest --no-daemon
